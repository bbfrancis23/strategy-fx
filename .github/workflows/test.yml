name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # mongodb-memory-server (used by mongo/controls tests) downloads a
      # MongoDB binary to ~/.cache/mongodb-binaries on first use. Without
      # caching it, every run re-downloads it, adding time and a flakiness
      # risk if the download source is slow/unavailable. Keyed on
      # package-lock.json so it busts automatically on a version bump.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-binaries-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-mongodb-binaries-

      - run: npm run lint

      # --passWithNoTests: this milestone's test/CI setup issues (#406, #407)
      # land before the ones that add actual test files (#408, #409), so CI
      # would otherwise fail on every PR in between purely for lacking tests.
      # Safe to drop once the repo has a permanent baseline of test files.
      - run: npm test -- --coverage --passWithNoTests
